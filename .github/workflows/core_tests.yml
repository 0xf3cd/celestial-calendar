name: Core Tests
  
on:
  push:
    branches: [ '**' ]
  # Fork PRs never push a branch here, so without this the whole file is blind to external
  # contributions (#194). Every job below carries `head.repo.fork` in its `if`: a same-repo PR
  # is already covered by the push run of its branch, and running both would double every leg.
  pull_request:
    branches: [ main ]

# Nothing here needs more than the source. Said out loud rather than inherited: the repo-level
# default is `read` today, but that lives in a setting no one reviews, and raising it would widen
# every job in this file without a diff to show for it.
permissions:
  contents: read

# Gate track of the #69 dual-track policy: the pinned default seed (the soak workflow
# random_soak.yml draws a fresh one per run). Must match DEFAULT_SEED in
# src/util/random.hpp.
env:
  CELESTIAL_TEST_SEED: "42"

jobs:
  linters-and-static-analysis:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork
    # 26.04 for the toolchain, not the OS: clang-tidy 22.1.2 ships in this image, and the
    # vendored `run-clang-tidy.py` has to match its major (AGENTS.md gotcha 9). #73
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        python-version: ["3.12"]  

    steps:  
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}  
        uses: actions/setup-python@v6 
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python Dependencies
        run: |  
          python3 -m pip install --upgrade pip  
          if [ -f Requirements.txt ]; then python3 -m pip install -r Requirements.txt; fi

          # Pinned; see AGENTS.md gotcha 9 (#72). clang-tidy is not here any more -- it comes
          # with the runner image, which is where its version is pinned now (#73).
          python3 -m pip install ruff==0.16.1

      # Pure parsing, so it rides this leg rather than paying for a job of its own -- but it
      # goes before the toolchain: `linter.py` exits on the first finding, and behind the
      # style checks a cmake or ruff failure would mask this verdict entirely (#144).
      - name: Check the AI workflows
        run: python3 ./linter.py --ai-workflows

      # The automation layer's own unit tests -- pure, rides the same leg; pytest comes in
      # pinned via Requirements.txt above (#87).
      - name: Run the automation unit tests
        run: python3 ./linter.py --pytest

      # Same pure-parsing kind as --ai-workflows: holds the four CELESTIAL_TEST_SEED copies
      # to each other, and the docker --build-arg line that keeps the docker legs from
      # silently falling back to the Dockerfile default (#170).
      - name: Check the seed copies agree
        run: python3 ./linter.py --seed-reconcile

      - name: Install CMake
        run: sudo apt install cmake

      # Every name carries its major: the image also ships unsuffixed `clang++` / `clang-tidy`
      # symlinks, and inheriting whichever major those point at is the thing this job exists to
      # prevent. `CLANG_TIDY` selects the binary; the version is pinned by the image above.
      - name: Style Check
        env:
          CXX:         clang++-22
          CC:          clang-22
          CLANG_TIDY:  clang-tidy-22
        run: |
          chmod +x project.py
          ./project.py --clean --cmake

          chmod +x linter.py
          ./linter.py --ruff --clang-tidy --abi-layout

          
  # Not deduplicated against linux-docker (build_and_test.yml), deliberately (#165, 2026-08-08).
  # The overlap is amd64 only, and only when a PR is open or that workflow is dispatched by hand:
  # this job runs on every push to every branch, while that one builds in a Debian container
  # (sid repo for gcc-14), is CI's only *Linux* arm64 coverage, and produces the release
  # artifacts. Delete this job and a branch gets no gcc feedback until a PR exists.
  # Revisit if the two workflows' trigger sets are made the same.
  test-ubuntu-gcc14:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-24.04 
    strategy:  
      matrix:  
        python-version: ["3.12"]  

    steps:  
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}  
        uses: actions/setup-python@v6 
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python Dependencies
        run: |  
          python3 -m pip install --upgrade pip  
          if [ -f Requirements.txt ]; then python3 -m pip install -r Requirements.txt; fi  

      - name: Install g++14
        run: |
          sudo add-apt-repository universe
          sudo apt update
          sudo apt install -y g++-14 gcc-14

      - name: Install CMake
        run: sudo apt install cmake

      - name: Build and Test
        env:
          CXX: g++-14
          CC:  gcc-14
        run: |
          chmod +x project.py
          ./project.py --setup --clean --cmake --build --test -v 1


  test-ubuntu-clang:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        python-version: ["3.12"]  

    steps:  
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}  
        uses: actions/setup-python@v6 
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python Dependencies
        run: |  
          python3 -m pip install --upgrade pip  
          if [ -f Requirements.txt ]; then python3 -m pip install -r Requirements.txt; fi  

      - name: Install CMake
        run: sudo apt install cmake

      - name: Build and Test
        env:
          CXX: clang++-22
          CC:  clang-22
        run: |
          chmod +x project.py
          ./project.py --setup --clean --cmake --build --test -v 1

      # The ctypes smoke gate needs the built shared library, and the linters leg
      # configures without building -- so it lives on a build leg, one step after the
      # library exists. One leg is enough: the wrappers and their goldens are
      # toolchain-independent, and the C ABI itself is pinned on every leg.
      - name: Smoke-test the ctypes bindings
        run: python3 ./linter.py --ctypes-smoke

      # The export-surface gate (#91) needs the built library for its dynamic half
      # (nm/readelf on the real .so), so it sits next to the ctypes smoke gate. One leg
      # is enough: the static half parses the header on any platform, and the dynamic
      # verdict -- strong exports plus std vague-linkage survivors -- is
      # toolchain-independent. What it cannot prove is the Windows/macOS branch of the
      # CELESTIAL_API macro; only cabi_smoke_test linking the DLL on those CI legs can.
      - name: Check the export surface
        run: python3 ./linter.py --export-surface

      # The log-names gate (#72) is pure parsing -- but it shares the entry-point parser
      # with the export-surface gate above, so it sits on the same leg: one place to look
      # when a header change trips the pair.
      - name: Check the log strings
        run: python3 ./linter.py --log-names


  # macOS and Windows build+test are not here: they live in `build_and_test.yml`, which runs on
  # pull requests to main and packages the artifacts -- running them here too repeated the same
  # compile-and-test on every push to a branch with a PR open. A push still gets both platforms from
  # `self-contained-headers` and `cxx-feature-probe` below -- three-way matrices that catch
  # platform-specific rot early (#72).

  # ASan + UBSan on one Linux leg. It sits here rather than in `build_and_test.yml` because this
  # workflow's critical path is `linters-and-static-analysis`, which has room a parallel job can
  # use; the other workflow's is the docker build, which has none. TSan is deliberately absent --
  # it cannot share a binary with ASan, and the only concurrency to point it at today is one test
  # in `util_test.cpp`. Worth revisiting when there is more (#72).
  sanitizers:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python Dependencies
        run: |
          python3 -m pip install --upgrade pip
          if [ -f Requirements.txt ]; then python3 -m pip install -r Requirements.txt; fi

      - name: Build under ASan + UBSan
        env:
          CXX: clang++-22
          CC:  clang-22
          # CMake seeds `CMAKE_CXX_FLAGS` from `CXXFLAGS` on a fresh configure, and `--clean` makes
          # every configure fresh -- so the sanitizers reach the build without `project.py` growing
          # a flag that exists for one CI job.
          # `-fno-sanitize-recover=all` is what makes UBSan fail rather than narrate: by default it
          # prints and carries on, and the job would stay green while reporting undefined behaviour.
          CXXFLAGS: "-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -g"
        run: |
          chmod +x project.py
          ./project.py --setup --clean --cmake --build --cores all -v 1

      - name: Run every test binary
        env:
          UBSAN_OPTIONS: print_stacktrace=1
        run: |
          # Not `--test`: that goes through `ctest -R <name>`, and a filter that matches nothing
          # makes gtest exit 0, which ctest records as a pass. A sanitizer gate that can silently
          # skip a binary is no gate, so run them directly and reconcile the count against the
          # `TEST(` macros -- proving the ones that ran are also the ones that exist.
          total=0
          for exe in build/test/*; do
            [ -f "$exe" ] && [ -x "$exe" ] || continue
            out=$("$exe" 2>&1) || { echo "$out"; echo "FAILED: $exe"; exit 1; }
            # `sed`, not a `grep | grep` pipeline: this step runs under `-eo pipefail`, where a
            # grep that matches nothing kills the job with no output at all. Say what happened.
            n=$(printf '%s' "$out" | sed -nE 's/^\[==========\] ([0-9]+) test.*/\1/p' | head -1)
            if [ -z "$n" ]; then
              echo "$out"
              echo "NO GTEST SUMMARY: $exe -- not a test binary, or it died before reporting"
              exit 1
            fi
            total=$((total + n))
          done
          # `TEST` and `TEST_F` only, because only those are one macro per test. `TEST_P` and
          # `TYPED_TEST` expand to one per parameter or per type, so counting them would undercount
          # and fail here for the wrong reason. Detect them instead: the day one appears, this
          # reconciliation stops being valid and should be rewritten, not quietly widened.
          if grep -rqE '^[[:space:]]*(TEST_P|TYPED_TEST)\(' src/test --include=*.cpp; then
            echo "TEST_P/TYPED_TEST present: one macro no longer means one test, so the count below"
            echo "cannot reconcile. Rewrite this check (count from --gtest_list_tests) before use."
            exit 1
          fi
          declared=$(grep -rhoE '^[[:space:]]*TEST(_F)?\(' src/test --include=*.cpp | wc -l)
          echo "ran $total, declared $declared"
          [ "$total" -eq "$declared" ] || { echo "count mismatch"; exit 1; }


  # Header self-containment (#71). Deliberately a matrix, not a single job: whether a
  # header is self-contained depends on the standard library, because each one includes
  # a different set of things transitively. `converter.hpp` used `assert` with no
  # <cassert> and was green on MSVC STL for months while broken on libc++. One leg
  # would have kept missing it, so run all three.
  self-contained-headers:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04     # libstdc++
            stdlib: libstdc++
            cxx: clang++-22
          - runner: macos-latest     # libc++
            stdlib: libc++
            cxx: clang++
          - runner: windows-latest   # MSVC STL
            stdlib: MSVC STL
            cxx: clang++

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Requirements.txt

      - name: Install clang (Windows)
        if: runner.os == 'Windows'
        # Pinned; see AGENTS.md gotcha 9 (#72, #73).
        run: choco install -y llvm --version=22.1.7

      # The compiler comes from the matrix, not from $GITHUB_ENV: a step-level `env:`
      # outranks anything written to $GITHUB_ENV, so setting CXX in the install step
      # above and again here would silently pin nothing.
      - name: Check every header compiles alone (${{ matrix.stdlib }})
        env:
          CXX: ${{ matrix.cxx }}
        run: python ./linter.py --self-contained


  # Which of the C++ features the codebase is waiting on each standard library can actually
  # compile (#131, #99). Deliberately a separate job from the self-containment one above: that
  # gate fails when someone breaks a header, this one fails when the world moves and a waiting
  # TODO becomes actionable. Sharing a job would let either verdict hide the other.
  #
  # clang++-22 on the Linux leg, which pairs it with the runner's default libstdc++ -- exactly
  # what `test-ubuntu-clang` builds against, so a row here describes a standard library the
  # project really compiles with. It is not the oldest one in the matrix: `test-ubuntu-gcc14`
  # installs g++-14 and gets libstdc++-14, older than ubuntu-26.04's default, and nothing probes
  # it. A feature can therefore read usable on all three legs here and still be missing there --
  # where it surfaces as a build failure rather than as a missed unlock, which is also why the
  # Docker arm64/x86_64 legs are not probed.
  cxx-feature-probe:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04     # libstdc++
            leg: libstdc++
            cxx: clang++-22
          - runner: macos-latest     # libc++
            leg: libc++
            cxx: clang++
          - runner: windows-latest   # MSVC STL
            leg: msvc-stl
            cxx: clang++

    steps:
      - uses: actions/checkout@v7

      # Same Xcode the macOS build leg pins. Without it this job reads the image default, and
      # the baseline would record a toolchain the project never actually compiles with.
      # Pinned (version + action SHA); see AGENTS.md gotcha 9 (#72, #73) and #177.
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        if: runner.os == 'macOS'
        with:
          xcode-version: '26'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Requirements.txt

      - name: Install clang (Windows)
        if: runner.os == 'Windows'
        # Pinned; see AGENTS.md gotcha 9 (#72, #73).
        run: choco install -y llvm --version=22.1.7

      - name: Probe awaited C++ features (${{ matrix.leg }})
        env:
          CXX: ${{ matrix.cxx }}
        run: python ./linter.py --features ${{ matrix.leg }}
