name: Core Tests
  
on:
  push:
    branches: [ '**' ]

# Gate track of the #69 dual-track policy: the pinned default seed (the soak workflow
# random_soak.yml draws a fresh one per run). Must match DEFAULT_SEED in
# src/util/random.hpp.
env:
  CELESTIAL_TEST_SEED: "42"

jobs:
  linters-and-static-analysis:  
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.12"]  

    steps:  
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}  
        uses: actions/setup-python@v6 
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python Dependencies
        run: |  
          python3 -m pip install --upgrade pip  
          if [ -f Requirements.txt ]; then python3 -m pip install -r Requirements.txt; fi

          # clang-tidy is pinned to match the clang-18 toolchain this job installs;
          # newer clang-tidy ships new checks that flag pre-existing code.
          python3 -m pip install ruff clang-tidy==18.1.8

      - name: Install LLVM and clang++
        run: |
          sudo add-apt-repository universe
          sudo apt update
          sudo apt install -y llvm-18 clang-18

      - name: Install CMake
        run: sudo apt install cmake

      - name: Style Check
        env:
          CXX: clang++-18
          CC:  clang-18
        run: |
          chmod +x project.py
          ./project.py --clean --cmake
          
          chmod +x linter.py
          ./linter.py --ruff --clang-tidy

          
  test-ubuntu-gcc14:  
    runs-on: ubuntu-24.04 
    strategy:  
      matrix:  
        python-version: ["3.12"]  

    steps:  
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}  
        uses: actions/setup-python@v6 
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python Dependencies
        run: |  
          python3 -m pip install --upgrade pip  
          if [ -f Requirements.txt ]; then python3 -m pip install -r Requirements.txt; fi  

      - name: Install g++14
        run: |
          sudo add-apt-repository universe
          sudo apt update
          sudo apt install -y g++-14 gcc-14

      - name: Install CMake
        run: sudo apt install cmake

      - name: Build and Test
        env:
          CXX: g++-14
          CC:  gcc-14
        run: |
          chmod +x project.py
          ./project.py --setup --clean --cmake --build --test -v 1


  test-ubuntu-clang:  
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.12"]  

    steps:  
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}  
        uses: actions/setup-python@v6 
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python Dependencies
        run: |  
          python3 -m pip install --upgrade pip  
          if [ -f Requirements.txt ]; then python3 -m pip install -r Requirements.txt; fi  

      - name: Install LLVM and clang++
        run: |
          sudo add-apt-repository universe
          sudo apt update
          sudo apt install -y llvm-18 clang-18

      - name: Install CMake
        run: sudo apt install cmake

      - name: Build and Test
        env:
          CXX: clang++-18
          CC:  clang-18
        run: |
          chmod +x project.py
          ./project.py --setup --clean --cmake --build --test -v 1


  test-macos-apple-clang:  
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ["3.12"]  

    steps:
    - uses: actions/checkout@v7

    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
    
    - name: Set up Python ${{ matrix.python-version }}  
      uses: actions/setup-python@v6 
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install Python Dependencies
      run: |  
        python3 -m pip install --upgrade pip  
        if [ -f Requirements.txt ]; then python3 -m pip install -r Requirements.txt; fi  

    - name: Build and Test
      env:
        CXX: clang++
        CC:  clang
      run: |
        chmod +x project.py
        ./project.py --setup --clean --cmake --build --test -v 1


  test-windows-clang:  
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.12"]  
  
    steps:  
      - uses: actions/checkout@v7

      - name: Set up Visual Studio
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: latest

      - name: Set up Python ${{ matrix.python-version }}  
        uses: actions/setup-python@v6 
        with:
          python-version: ${{ matrix.python-version }}
  
      - name: Install Dependencies
        run: |  
          python -m pip install --upgrade pip  
          if (Test-Path "Requirements.txt") { python -m pip install -r "Requirements.txt" }

          choco install -y make llvm

      - name: Build and Test
        env:
          CXX: clang++
          CC:  clang
        run: |
          chcp.com 65001
          $env:PYTHONIOENCODING = "utf-8"
          python3 ./project.py --setup --clean --cmake --build --test -v 1


  # Header self-containment (#71). Deliberately a matrix, not a single job: whether a
  # header is self-contained depends on the standard library, because each one includes
  # a different set of things transitively. `converter.hpp` used `assert` with no
  # <cassert> and was green on MSVC STL for months while broken on libc++. One leg
  # would have kept missing it, so run all three.
  self-contained-headers:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04     # libstdc++
            stdlib: libstdc++
          - runner: macos-latest     # libc++
            stdlib: libc++
          - runner: windows-latest   # MSVC STL
            stdlib: MSVC STL

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install clang (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository universe
          sudo apt update
          sudo apt install -y clang-18
          echo "CXX=clang++-18" >> $GITHUB_ENV

      - name: Install clang (Windows)
        if: runner.os == 'Windows'
        run: choco install -y llvm

      - name: Check every header compiles alone (${{ matrix.stdlib }})
        env:
          CXX: clang++
        run: python3 ./linter.py --self-contained
