# Rehearsal instrument for the release gates (docs/RELEASING.md). Dispatch-only, never
# triggered by push/PR: run it on a disposable vX.Y.Z-rehearsal tag after release-workflow
# changes, before the release tag. Carries no secrets and requests no OIDC token.

name: release-rehearsal

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate_ref:
    name: Require a disposable rehearsal tag
    runs-on: ubuntu-latest
    steps:
      - name: Check ref
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          # A real vX.Y.Z tag is the release identity; the rehearsal only runs on a clearly
          # disposable vX.Y.Z-rehearsal tag, which still matches the environments' v*.*.*
          # deployment tag policy. Any other ref fails loudly instead of skipping the gates.
          if [ "$REF_TYPE" != "tag" ] || ! [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rehearsal$ ]]; then
            echo "dispatch on a disposable vX.Y.Z-rehearsal tag, got $REF_TYPE $REF_NAME"
            exit 1
          fi

  stage_candidate:
    name: Stage a stand-in candidate artifact
    needs: validate_ref
    runs-on: ubuntu-latest
    steps:
      - name: Write stand-in manifest
        run: |
          {
            echo "rehearsal candidate manifest"
            echo "tag: ${{ github.ref_name }}"
            echo "commit: ${{ github.sha }}"
          } | tee manifest.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: rehearsal-candidate
          path: manifest.txt
          retention-days: 1

  gate_pypi:
    name: Rehearse pypi environment approval
    needs: stage_candidate
    environment: pypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: rehearsal-candidate
      - name: Show the manifest being approved
        run: cat manifest.txt

  gate_npm:
    name: Rehearse npm environment approval
    needs: stage_candidate
    environment: npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: rehearsal-candidate
      - name: Show the manifest being approved
        run: cat manifest.txt

  recovery_drill:
    name: Fail once, recover the same-run artifact on rerun
    needs: stage_candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: rehearsal-candidate
      - name: Verify artifact, fail on first attempt only
        run: |
          grep -q "rehearsal candidate manifest" manifest.txt
          if [ "${{ github.run_attempt }}" = "1" ]; then
            echo "attempt 1: failing on purpose; rerun with --failed to rehearse recovery"
            exit 1
          fi
          echo "attempt ${{ github.run_attempt }}: same-run artifact recovered"
