name: WASM Build and Golden Check

# Independent leg for the optional wasm target (#163) — deliberately outside the
# build_and_test.yml matrix, so the emsdk toolchain never slows the main gate.
on:
  workflow_dispatch: {}  # Allows manual triggering of the workflow
  pull_request:
    branches: [ main ]  # Also triggers on pull requests to the main branch

# Read-only is enough: this leg builds and checks, and the upload goes through
# `actions/upload-artifact`, which uses the Actions runtime token rather than this one.
permissions:
  contents: read

# emsdk is pinned like every diagnostic-capable toolchain in this repo (AGENTS.md gotcha
# 9): bump deliberately, never incidentally. The commit fixes the installer and manifest;
# the version still selects the prebuilt toolchain. Either bump makes a fresh install.
env:
  EMSDK_VERSION: "6.0.6"
  EMSDK_COMMIT: "9981799f744be74ac67b1c1813ff172f63be0630"
  NODE_CURRENT: "24.19.0"
  NODE_FLOOR: "22.0.0"
  NPM_VERSION: "11.17.0"

jobs:
  wasm:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # The unpacked SDK is ~2 GB; caching it turns the toolchain step into seconds.
      # Activation state lives inside the directory, so a cache hit is ready to use.
      - name: Cache emsdk
        id: emsdk-cache
        uses: actions/cache@v4
        with:
          path: emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}-${{ env.EMSDK_COMMIT }}-${{ runner.os }}

      - name: Install emsdk (cache miss only)
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        run: |
          git init emsdk
          git -C emsdk remote add origin https://github.com/emscripten-core/emsdk.git
          git -C emsdk fetch --depth 1 origin "$EMSDK_COMMIT"
          git -C emsdk checkout --detach FETCH_HEAD
          ./emsdk/emsdk install "$EMSDK_VERSION"
          ./emsdk/emsdk activate "$EMSDK_VERSION"

      - name: Verify emsdk source identity
        run: |
          actual_commit=$(git -C emsdk rev-parse HEAD)
          if [ "$actual_commit" != "$EMSDK_COMMIT" ]; then
            echo "Unexpected emsdk commit: $actual_commit"
            exit 1
          fi
          if git -C emsdk symbolic-ref --quiet HEAD >/dev/null; then
            echo "emsdk checkout is not detached"
            exit 1
          fi

      - name: Set up current Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_CURRENT }}
          cache: npm
          cache-dependency-path: bindings/javascript/package-lock.json

      - name: Pin npm and install JavaScript development dependencies
        run: |
          npm install --global "npm@$NPM_VERSION"
          node --version
          npm --version
          npm ci --ignore-scripts --prefix bindings/javascript

      - name: Build the WASM module (web,node single build)
        run: python3 toolbox/build_wasm.py --emsdk emsdk

      - name: Full ABI protocol + golden dataset + size gate
        run: node toolbox/wasm_check.mjs

      - name: Stage and pack the npm package
        id: npm-package
        run: |
          python3 toolbox/build_npm.py
          filename=$(node -e '
            const pack = require("./build/npm/npm-pack.json");
            if (!Array.isArray(pack) || pack.length !== 1) process.exit(1);
            process.stdout.write(pack[0].filename);
          ')
          if [ "$(basename "$filename")" != "$filename" ] || [ ! -f "build/npm/$filename" ]; then
            echo "Invalid npm-pack.json filename: $filename"
            exit 1
          fi
          echo "tarball=build/npm/$filename" >> "$GITHUB_OUTPUT"

      - name: Current Node package, types, and exact-tarball consumers
        run: |
          node bindings/javascript/test/node/public_api_test.mjs build/npm/package/index.mjs
          node bindings/javascript/test/node/tarball_consumer_test.mjs "${{ steps.npm-package.outputs.tarball }}"
          npm run test:types --prefix bindings/javascript

      - name: npm package publish dry-run
        env:
          NPM_CONFIG_DRY_RUN: "true"
        run: |
          npm publish --dry-run "${{ steps.npm-package.outputs.tarball }}"

      - name: Astro production build and Chrome package smoke
        run: node bindings/javascript/test/browser/browser_test.mjs "${{ steps.npm-package.outputs.tarball }}"

      - name: Set up Node runtime floor
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_FLOOR }}

      - name: Exact Node floor package consumers
        run: |
          node --version
          npm --version
          node bindings/javascript/test/node/public_api_test.mjs build/npm/package/index.mjs
          node bindings/javascript/test/node/tarball_consumer_test.mjs "${{ steps.npm-package.outputs.tarball }}"

      # The release flow downloads this artifact for the tagged commit (the ritual
      # dispatches both build workflows; this leg stays dispatch+PR only). Alignment
      # with build_and_test.yml's four uploads: v7 action, 30-day retention, and a
      # missing payload is an error, never a silently empty package.
      - name: Upload the WASM artifact
        uses: actions/upload-artifact@v7
        with:
          name: celestial-wasm
          path: build/npm/artifact/
          retention-days: 30
          if-no-files-found: error
