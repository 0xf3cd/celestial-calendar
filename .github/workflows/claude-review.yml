name: Claude Review (manual)

# No automatic trigger: the daily auto-review seat moved to Codex; this workflow is the
# on-demand Claude seat, so the API key is spent only when someone dispatches it (#144:
# a standing red — e.g. an empty API balance — is how people learn to ignore red).
# Asking Claude about a PR also works via the `@claude` mention path in claude.yml.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review"
        required: true
        type: number

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write # traded for the action's App token; drop it and claude[bot] goes silent (#148)
    steps:
      # The action fetches into an existing checkout and never clones, so the repo must be
      # checked out first; `gh pr checkout` then switches it onto the requested PR branch.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # --detach: for a fork PR whose head branch is named e.g. `main`, plain `gh pr checkout`
      # would try to create a local branch that already exists here and abort before Claude runs.
      - name: Check out the PR branch
        run: gh pr checkout --detach "${{ inputs.pr_number }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Pinned to a SHA: the only third-party action here that is handed a repo secret (#144).
      - uses: anthropics/claude-code-action@6b082c41935b4c8a3b8b0ef85ba4ba4d9eeb8975 # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ inputs.pr_number }}

            Please review this pull request with a focus on:
            - Code quality and best practices
            - Potential bugs or issues
            - Security implications
            - Performance considerations

            Note: The PR branch is already checked out in the current working directory.

            Use `gh pr comment` for top-level feedback.
            Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`) to highlight specific code issues.
            Only post GitHub comments - don't submit review text as messages.

          claude_args: |
            --model claude-sonnet-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

