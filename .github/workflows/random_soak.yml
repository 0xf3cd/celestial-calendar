name: Random Seed Soak

# Exploration track of the #69 dual-track testing policy: the PR/push gate uses the
# C++ default seed, while this weekly (or manually dispatched) soak draws a fresh seed
# per run. CELESTIAL_TEST_SEED = github.run_id — unique per run, visible in the run URL,
# and directly replayable. A soak failure is never dismissed as a flake: replay the
# failing ctest entry with the same seed (each ctest case starts a fresh process from
# draw 0), then bake the find into a directed regression test.

on:
  schedule:
    - cron: '17 3 * * 0'  # weekly, Sunday 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  CELESTIAL_TEST_SEED: ${{ github.run_id }}

jobs:
  soak-ubuntu-clang:
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/native-toolchain
        with:
          python-version: "3.12"

      - name: Build and Test
        uses: ./.github/actions/native-build
        env:
          CXX: clang++-22
          CC:  clang-22
      - name: Verify received soak seed
        shell: bash
        run: |
          output=$(./build/test/earth_test --gtest_filter=Earth.ObliquityJ2000 2>&1)
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -Fx "[ util::random ] seed = $GITHUB_RUN_ID (override: CELESTIAL_TEST_SEED)"


  soak-macos-apple-clang:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v7

    - uses: ./.github/actions/native-toolchain
      with:
        python-version: "3.12"

    - name: Build and Test
      uses: ./.github/actions/native-build
      env:
        CXX: clang++
        CC:  clang
        MACOSX_DEPLOYMENT_TARGET: "14.0"
    - name: Verify received soak seed
      shell: bash
      run: |
        output=$(./build/test/earth_test --gtest_filter=Earth.ObliquityJ2000 2>&1)
        printf '%s\n' "$output"
        printf '%s\n' "$output" | grep -Fx "[ util::random ] seed = $GITHUB_RUN_ID (override: CELESTIAL_TEST_SEED)"


  soak-windows-clang:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/native-toolchain
        with:
          python-version: "3.12"

      - name: Build and Test
        uses: ./.github/actions/native-build
        env:
          CXX: clang++
          CC:  clang
      - name: Verify received soak seed
        shell: pwsh
        run: |
          $output = & ./build/test/earth_test.exe --gtest_filter=Earth.ObliquityJ2000 2>&1
          $code = $LASTEXITCODE
          $lines = @($output | ForEach-Object { "$_" })
          $lines | Write-Output
          if ($code -ne 0) { exit $code }
          if ($lines -notcontains "[ util::random ] seed = $env:GITHUB_RUN_ID (override: CELESTIAL_TEST_SEED)") {
            throw "The RNG binary did not receive the soak run-ID seed."
          }

  weekly-cxx-feature-probe:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            leg: libstdc++
            cxx: clang++-22
          - runner: macos-latest
            leg: libc++
            cxx: clang++
          - runner: windows-latest
            leg: msvc-stl
            cxx: clang++
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/native-toolchain
        with:
          python-version: "3.12"
      - name: Probe awaited C++ features
        env:
          CXX: ${{ matrix.cxx }}
        run: python ./checks.py --features ${{ matrix.leg }}
