name: Create Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  create_release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # Pinned because this job can publish release assets with contents: write (#214).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python Dependencies
        run: python3 -m pip install -r Requirements.txt

      - name: Sanity Check on Version
        # The tag name is attacker-chosen text and this job runs with contents: write, so it
        # goes through env rather than expression interpolation into the shell (#144). The `v`
        # stripped below is guaranteed by the tag filter above, not by anything in this step.
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          version_nums=${TAG_NAME#v}

          chmod +x project.py
          expected_version_nums=$(./project.py --version)
          expected_version_nums=$(echo "$expected_version_nums" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')

          if [ "$version_nums" != "$expected_version_nums" ]; then
            echo "Expected version number: $expected_version_nums"
            echo "Actual version number: $version_nums"
            exit 1
          fi

          python3 -c \
            'import sys; from toolbox.release_validation import validate_release_document_versions; validate_release_document_versions(sys.argv[1])' \
            "$TAG_NAME"

      - name: Download Artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x toolbox/artifact_downloader.py
          ./toolbox/artifact_downloader.py --save-to ./release_assets

      - name: Copy CHANGELOG.md
        run: cp docs/CHANGELOG.md ./release_assets

      - name: Create Release
        id: create_release
        # Pinned to a SHA: it runs in a contents: write job and publishes the release assets (#144).
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        with:
          artifacts: "release_assets/*"
          bodyFile: "docs/RELEASE_NOTES.md"
