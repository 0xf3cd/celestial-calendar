name: Create Release

on:
  workflow_dispatch:
    inputs:
      native_run_id:
        description: Successful native workflow run ID for this tag
        required: true
        type: string
      wasm_run_id:
        description: Successful WASM/npm workflow run ID for this tag
        required: true
        type: string
      python_run_id:
        description: Successful Python-wheel workflow run ID for this tag
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare_release:
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Validate protected release context
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_PROTECTED: ${{ github.ref_protected }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess

          ref_name = os.environ["REF_NAME"]
          if os.environ["REF_TYPE"] != "tag" or re.fullmatch(r"v\d+\.\d+\.\d+", ref_name) is None:
            raise SystemExit(f"Release workflow requires a vMAJOR.MINOR.PATCH tag, got {ref_name!r}")
          if os.environ["REF_PROTECTED"] != "true":
            raise SystemExit(f"Release tag is not protected by a ruleset: {ref_name}")
          expected = subprocess.run(
            ["./project.py", "--version"], check=True, capture_output=True, text=True
          ).stdout.strip()
          if ref_name != f"v{expected}":
            raise SystemExit(f"Release tag {ref_name} does not match project version {expected}")
          PY
          git merge-base --is-ancestor HEAD origin/main
          python3 -c \
            'import os; from toolbox.release_validation import validate_release_document_versions; validate_release_document_versions(os.environ["REF_NAME"])'

      - name: Install pinned Python dependencies
        run: python3 -m pip install -r Requirements.txt

      - name: Download exact producer runs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NATIVE_RUN_ID: ${{ inputs.native_run_id }}
          PYTHON_RUN_ID: ${{ inputs.python_run_id }}
          WASM_RUN_ID: ${{ inputs.wasm_run_id }}
        run: |
          python3 toolbox/artifact_downloader.py \
            --save-to release_assets \
            --native-run-id "$NATIVE_RUN_ID" \
            --wasm-run-id "$WASM_RUN_ID" \
            --python-run-id "$PYTHON_RUN_ID" \
            --source-manifest release-sources.json

      - name: Stage immutable release candidate
        env:
          COMMIT_SHA: ${{ github.sha }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          cp docs/CHANGELOG.md release_assets/CHANGELOG.md
          python3 toolbox/release_candidate.py \
            --release-assets release_assets \
            --source-manifest release-sources.json \
            --save-to candidate \
            --tag "$TAG_NAME" \
            --commit "$COMMIT_SHA"
          {
            echo "## Release candidate"
            echo '```json'
            python3 -m json.tool candidate/evidence/manifest.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: celestial-release-candidate
          path: candidate/
          retention-days: 30
          if-no-files-found: error

  create_release:
    needs: prepare_release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download immutable release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: celestial-release-candidate
          path: candidate

      - name: Create immutable GitHub Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        with:
          artifacts: "candidate/github/*"
          bodyFile: "candidate/evidence/RELEASE_NOTES.md"
          immutableCreate: true
          artifactErrorsFailBuild: true
