name: Build and Test on Multiple Platforms

on:
  workflow_dispatch: {}  # Allows manual triggering of the workflow
  pull_request:
    branches: [ main ]  # Also triggers on pull requests to the main branch

# Read-only is enough: the artifacts go through `actions/upload-artifact`, which uses the Actions
# runtime token rather than this one, and nothing here pushes an image or writes to the repo.
permissions:
  contents: read

# Gate track of the #69 dual-track policy: the pinned default seed (the soak workflow
# random_soak.yml draws a fresh one per run). Must match DEFAULT_SEED in
# src/util/random.hpp.
env:
  CELESTIAL_TEST_SEED: "42"

jobs:
  linux-docker:
    name: linux-docker (${{ matrix.platform }}, ${{ matrix.runner }})
    # 2026-07: matrix trimmed from 8 QEMU-emulated platforms to the two real
    # deployment targets (x86_64 servers, arm64 Pi/Apple Silicon), both on
    # native runners — no QEMU, wall-clock minutes instead of ~40. The wide
    # matrix was exploration; its findings live in the repo history (#46).
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "linux/amd64"
            runner: ubuntu-latest
            image: quay.io/pypa/manylinux_2_28_x86_64@sha256:012f4a50472412f18bb2b450c1cce7158434cfae4ae878591c2748a13a30c2be
          - platform: "linux/arm64"
            runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64@sha256:52e4da6e9348db7cd0b529a827623b62b7c1fe867ba515ae752fa13d41f7f46e

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        # Pinned to a SHA: third-party action on the Linux Docker build path (#177).
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Set up Environment Variables
        id: set-env-vars
        run: |
          platform="${{ matrix.platform }}"
          os=$(echo "${platform}" | cut -d '/' -f 1)
          arch=$(echo "${platform}" | cut -d '/' -f 2- | tr '/' '_')

          image_tag="celestial-calendar-${os}-${arch}"
          proj_dir=$(pwd)
          output_dir="${proj_dir}/output_${os}_${arch}"

          # Set environment variables
          echo "OS=${os}" >> $GITHUB_ENV
          echo "ARCH=${arch}" >> $GITHUB_ENV
          echo "IMAGE_TAG=${image_tag}" >> $GITHUB_ENV
          echo "PROJ_DIR=${proj_dir}" >> $GITHUB_ENV
          echo "OUTPUT_DIR=${output_dir}" >> $GITHUB_ENV

          echo "OUTPUT_DIR=${output_dir}" >> $GITHUB_OUTPUT

      - name: Clean up Output Directory
        run: |
          # Remove the output directory if it exists and recreate it
          if [ -d "$OUTPUT_DIR" ]; then
            rm -rf "$OUTPUT_DIR"
          fi
          mkdir -p "$OUTPUT_DIR"

      - name: Get Build Version
        id: get-build-version
        run: |
          chmod +x ./project.py

          build_version=$(./project.py --version)

          # Remove trailing newline
          build_version="${build_version%$'\n'}"

          echo "BUILD_VERSION=${build_version}" >> $GITHUB_OUTPUT

      - name: Build and Run Docker Image
        run: |
          # Create and use a new Buildx builder instance
          docker buildx create --use

          # Build the Docker image for the specified platform
          # NB: $ARCH has '/' replaced by '_' for use in file/image names,
          # so it must NOT be used for --platform (linux/arm_v7 matches nothing).
          docker buildx build \
            --platform ${{ matrix.platform }} -t $IMAGE_TAG \
            --build-arg BASE_IMAGE=${{ matrix.image }} \
            --build-arg DOCKER_PLATFORM=${{ matrix.platform }} \
            --build-arg CELESTIAL_TEST_SEED=${{ env.CELESTIAL_TEST_SEED }} \
            --load .

          # Run the Docker image and install the artifacts to the output directory
          docker run --rm \
            -e ARTIFACT_NAME="${OS}_${ARCH}" \
            -v $OUTPUT_DIR:/output \
            $IMAGE_TAG \
            /bin/bash -c 'cmake --install /app/build --prefix /output/install && cp /app/*.json /output/ && python3 /app/toolbox/runtime_floor.py --artifact "$ARTIFACT_NAME" --binary /output/install/lib/libcelestial_calendar.so --build-info /output/build_info.json'


      - name: Rename Shared Library
        id: shared_lib
        run: |
          # Store the current working directory
          ROOT_DIR=$(pwd)

          # Create a destination directory
          DEST_DIR="$ROOT_DIR/${OS}_${ARCH}"
          mkdir -p "$DEST_DIR"

          # Take what `cmake --install` produced in the container: real library file,
          # SOVERSION symlinks, and the published header (lib/ + include/ tree).
          # The symlinks are checked below but do NOT survive the upload: upload-artifact@v7
          # dereferences them, so a consumer downloading the artifact gets three identical
          # copies rather than a version chain (measured on this PR's first green run).
          # Harmless to link against -- the unversioned name is still there -- but do not
          # promise a consumer a symlink chain.
          cp -r "$OUTPUT_DIR/install/." "$DEST_DIR/"

          VERSION="${{ steps.get-build-version.outputs.BUILD_VERSION }}"
          MAJOR="${VERSION%%.*}"
          if [ "$MAJOR" = "0" ]; then
            SOVERSION="${VERSION%.*}"
          else
            SOVERSION="$MAJOR"
          fi

          # Guard on what install produced, not on what a glob matched (#72): the JSON
          # files below keep this directory non-empty whatever happens, so
          # `if-no-files-found: error` on the upload cannot catch an artifact that ships
          # with no library in it.
          ok=1
          [ -f "$DEST_DIR/lib/libcelestial_calendar.so.${VERSION}" ] || { echo "missing lib/libcelestial_calendar.so.${VERSION}"; ok=0; }
          [ -L "$DEST_DIR/lib/libcelestial_calendar.so.${SOVERSION}" ] || { echo "missing symlink lib/libcelestial_calendar.so.${SOVERSION}"; ok=0; }
          [ -L "$DEST_DIR/lib/libcelestial_calendar.so" ] || { echo "missing symlink lib/libcelestial_calendar.so"; ok=0; }
          [ -f "$DEST_DIR/include/celestial.h" ] || { echo "missing include/celestial.h"; ok=0; }
          [ "$ok" -eq 1 ] || exit 1

          # Copy the build info JSON files to the destination directory
          cp "$OUTPUT_DIR/build_info.json" "$DEST_DIR/"
          cp "$OUTPUT_DIR/cpu_info.json" "$DEST_DIR/"

          # Set environment variables for GitHub Actions
          {
            echo "artifact_name=${OS}_${ARCH}"
            echo "artifact_path=${DEST_DIR}"
          } >> $GITHUB_ENV

          {
            echo "artifact_name=${OS}_${ARCH}"
            echo "artifact_path=${DEST_DIR}"
          } >> $GITHUB_OUTPUT

          # Print to stdout
          echo "artifact_name=${OS}_${ARCH}"
          echo "artifact_path=${DEST_DIR}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.shared_lib.outputs.artifact_name }}
          path: ${{ steps.shared_lib.outputs.artifact_path }}
          retention-days: 30
          if-no-files-found: error


  macos:
    runs-on: macos-latest
    strategy:  
      matrix:  
        python-version: ["3.12"]  

    steps:
    - uses: actions/checkout@v7

    # Pinned (version + action SHA); see AGENTS.md gotcha 9 (#72, #73) and #177.
    - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
      with:
        xcode-version: '26'
    
    - name: Set up Python ${{ matrix.python-version }}  
      uses: actions/setup-python@v6 
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install Python Dependencies
      run: >-
        python3 -m pip install --require-hashes --only-binary :all:
        -r Requirements-producer.txt

    - name: Build and Test
      env:
        CXX: clang++
        CC:  clang
        MACOSX_DEPLOYMENT_TARGET: "14.0"
      run: |
        chmod +x project.py
        ./project.py --clean --cmake --cores all --build --test -v 1

    - name: Ensure Shared Lib Exists
      id: shared_lib
      env:
        CXX: clang++
        CC:  clang
        MACOSX_DEPLOYMENT_TARGET: "14.0"
      run: |
        # Install by CMake's rules: real .dylib + version symlinks + the published header.
        # The symlinks do not survive upload-artifact@v7 (it dereferences them) -- see the
        # linux-docker packaging step for the measurement. Guard on install's output anyway:
        # that is the step this job owns.
        cmake --install ./build --prefix ./macos_arm64

        VERSION=$(./project.py --version)
        MAJOR="${VERSION%%.*}"
        if [ "$MAJOR" = "0" ]; then
          SOVERSION="${VERSION%.*}"
        else
          SOVERSION="$MAJOR"
        fi

        # Guard on what install produced, not on what a glob matched (#72). macOS puts the
        # version inside the name: real file libcelestial_calendar.${VERSION}.dylib with
        # .${SOVERSION}.dylib and .dylib symlinks.
        ok=1
        [ -f "./macos_arm64/lib/libcelestial_calendar.${VERSION}.dylib" ] || { echo "missing lib/libcelestial_calendar.${VERSION}.dylib"; ok=0; }
        [ -L "./macos_arm64/lib/libcelestial_calendar.${SOVERSION}.dylib" ] || { echo "missing symlink lib/libcelestial_calendar.${SOVERSION}.dylib"; ok=0; }
        [ -L "./macos_arm64/lib/libcelestial_calendar.dylib" ] || { echo "missing symlink lib/libcelestial_calendar.dylib"; ok=0; }
        [ -f "./macos_arm64/include/celestial.h" ] || { echo "missing include/celestial.h"; ok=0; }
        [ "$ok" -eq 1 ] || exit 1

        # Pack the "build_info.json" to the "macos_arm64" folder
        chmod +x ./toolbox/build_info.py
        ./toolbox/build_info.py --save-to ./macos_arm64
        python3 ./toolbox/runtime_floor.py \
          --artifact macos_arm64 \
          --binary ./macos_arm64/lib/libcelestial_calendar.dylib \
          --build-info ./macos_arm64/build_info.json

        # If exists, save the path to GITHUB_OUTPUT
        echo "artifact_name=macos_arm64" >> $GITHUB_OUTPUT
        echo "artifact_path=./macos_arm64" >> $GITHUB_OUTPUT

    - name: GitHub Artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.shared_lib.outputs.artifact_name }}
        path: ${{ steps.shared_lib.outputs.artifact_path }}
        retention-days: 30
        if-no-files-found: error


  windows:
    runs-on: windows-latest
    strategy:  
      matrix:  
        python-version: ["3.12"]  
  
    steps:  
      - uses: actions/checkout@v7

      - name: Set up Visual Studio
        # Pinned to a SHA: third-party action on the Windows build path (#177).
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2
        with:
          vs-version: latest

      - name: Set up Python ${{ matrix.python-version }}  
        uses: actions/setup-python@v6 
        with:
          python-version: ${{ matrix.python-version }}
  
      - name: Install Dependencies
        run: |  
          python3 -m pip install --require-hashes --only-binary :all: -r Requirements-producer.txt

          # Pinned; see AGENTS.md gotcha 9 (#72, #73).
          choco install -y make
          choco install -y llvm --version=22.1.7

      - name: Build and Test
        env:
          CXX: clang++
          CC:  clang
        run: |
          chcp.com 65001
          $env:PYTHONIOENCODING = "utf-8"
          python3 ./project.py --clean --cmake --cores all --build --test -v 1

      - name: Ensure Shared Lib Exists
        id: shared_lib
        env:
          CXX: clang++
          CC:  clang
        run: |
          # Define the root directory and output directory
          $ROOT_DIR = (Get-Location).Path
          $destDir = "$ROOT_DIR/windows_x86_64"

          # Install by CMake's rules: the .dll lands in bin/, its import .lib in lib/,
          # the published header in include/.
          cmake --install ./build --prefix $destDir

          # Guard on what install produced, not on what a glob matched (#72):
          # build_info.json below keeps this directory non-empty whatever happens, so
          # `if-no-files-found: error` on the upload cannot catch an artifact that ships
          # with no library in it.
          $ok = $true
          if (!(Test-Path "$destDir/bin/celestial_calendar.dll")) { Write-Output "missing bin/celestial_calendar.dll"; $ok = $false }
          if (!(Test-Path "$destDir/lib/celestial_calendar.lib")) { Write-Output "missing lib/celestial_calendar.lib"; $ok = $false }
          if (!(Test-Path "$destDir/include/celestial.h")) { Write-Output "missing include/celestial.h"; $ok = $false }
          if (!$ok) { exit 1 }

          # Pack the "build_info.json" to the "windows_x86_64" folder
          python3 ./toolbox/build_info.py --save-to $destDir
          python3 ./toolbox/runtime_floor.py `
            --artifact windows_x86_64 `
            --binary "$destDir/bin/celestial_calendar.dll" `
            --build-info "$destDir/build_info.json"

          # Set the lib environment variables
          Write-Output "artifact_name=windows_x86_64" >> $env:GITHUB_OUTPUT
          Write-Output "artifact_path=$destDir" >> $env:GITHUB_OUTPUT

          # Print to stdout
          Write-Output "artifact_name=windows_x86_64"
          Write-Output "artifact_path=$destDir"

      - name: GitHub Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.shared_lib.outputs.artifact_name }}
          path: ${{ steps.shared_lib.outputs.artifact_path }}
          retention-days: 30
          if-no-files-found: error
