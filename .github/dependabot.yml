version: 2

updates:
  # A SHA pin (#144) raises no Dependabot alert -- advisories are matched against semver refs --
  # so version updates are the only thing keeping it current. They rewrite the `# v1` marker
  # next to the SHA, which is what makes those markers worth reading. Monthly and grouped: a
  # pin whose diff nobody reads is a floating tag with extra steps.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: "/bindings/javascript"
    schedule:
      interval: monthly
    groups:
      javascript:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    # Version updates only; this does not suppress security alerts. See docs/MAINTAINING.md.
    exclude-paths: ["Requirements-statistics.txt"]
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: "/bindings/python"
    schedule:
      interval: monthly
    groups:
      python-wheel:
        patterns: ["*"]
