[build-system]
requires = ["scikit-build-core==1.1.1"]
build-backend = "scikit_build_core.build"

[project]
name = "celestial-calendar"
dynamic = ["version", "readme", "urls"]
description = "Astronomical calculations and Chinese calendar conversion powered by CelestialCalendar"
requires-python = ">=3.11"
license = "MIT"
keywords = ["astronomy", "chinese-calendar", "lunar-calendar", "jieqi", "ephemeris"]
authors = [{ name = "Ningqi Wang (0xf3cd)", email = "nq.maigre@gmail.com" }]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Astronomy",
]

[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.regex"
field = "version"
input = "../../project.py"
regex = '''BUILD_VERSION: Final\[str\] = "(?P<value>[^"]+)"'''

[[tool.dynamic-metadata]]
provider = {path = "../..", module = "toolbox.package_docs"}

[[tool.scikit-build.generate]]
path = "celestial_calendar/_version.py"
template = '''VERSION = "${version}"'''

[tool.scikit-build]
minimum-version = "1.0.3"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/celestial_calendar"]
wheel.py-api = "py3"
wheel.platlib = true
wheel.license-files = []
install.components = ["python"]
